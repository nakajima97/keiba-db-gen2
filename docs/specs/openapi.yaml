openapi: 3.1.0
info:
  title: Keiba DB API
  version: 0.1.0
  description: |
    Keiba DB の REST API 定義。

    issue #183 では、レース詳細画面で使う「印（出走馬ごとの予想記号）」を
    自動保存するための API を定義する。

    レース詳細画面そのもの（レース情報＋出馬表＋初期表示用の印情報）は
    Inertia 経由でサーバーから渡されるため、対応する JSON GET API は持たない。
servers:
  - url: /
    description: 同一オリジン

tags:
  - name: race-mark-columns
    description: レースの印列（自分の印列・他人の印列）の管理
  - name: race-marks
    description: 出走馬ごとの印の値の設定・解除
  - name: race-mark-memos
    description: |
      出走馬の印に対するメモ（issue #189）の管理。
      他人の印列（`type=other`）の各印にメモを残すための API。
      メモは印（`race_marks`）と独立したライフサイクルを持つ。印を変更・解除してもメモは残る。
  - name: horse-notes
    description: 競走馬ごとのメモ（issue #25）の管理。レース紐づきあり・なしの両方に対応する
  - name: trainer-notes
    description: |
      調教師ごとのメモ（issue #308）の管理。調教師コメントの信用度などの所感を残す。
      メモは認証ユーザー × 調教師で 1 件。
  - name: entry-comments
    description: |
      出走馬ごとの調教師・騎手コメントとその当否（issue #316）の管理。
      コメントは認証ユーザーごとに記録し、発言者種別（trainer / jockey）ごとに別テーブルで保持する。
      発言者（調教師・騎手）は出走情報（race_entries.trainer_id / jockey_id）から自動で決まる。
      更新系のレスポンスには、当該出走の調教師・騎手について集計し直した向き別の的中率（stats）を含める。
  - name: race-nominations
    description: |
      特別登録・出走登録など、出走確定前の登録馬（issue #305）の管理。
      登録馬リストは全ユーザー共通、チェック／消しはユーザーごと。
      登録馬のテキストメモは horse-notes（レース紐づき）を利用する。
  - name: race-nomination-column-marks
    description: |
      登録馬に対する他人の印・印メモ（issue #321）の管理。
      印列は出馬表と共通の `race_mark_columns` を使い、他人の印列（`type=other`）のみ受け付ける。
      印メモは印と独立したライフサイクルを持つ。印を変更・解除してもメモは残る。
      登録馬が出走馬になっても、出走馬の印（race-marks）へは引き継がない。
  - name: horses
    description: 競走馬の検索

paths:
  /api/races/{uid}/mark-columns:
    parameters:
      - $ref: "#/components/parameters/RaceUid"
    get:
      tags: [race-mark-columns]
      summary: 自分が所有する印列の一覧取得
      description: |
        指定レースにおける、認証ユーザー所有の印列をすべて返す。
        `display_order` 昇順で返す。自分の印列（`type=own`）は必ず 1 件含まれ、
        存在しない場合はサーバ側で自動生成された上で返される。
      operationId: listRaceMarkColumns
      security:
        - sessionAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RaceMarkColumn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [race-mark-columns]
      summary: 他人の印列を追加
      description: |
        指定レースに「他人の印列」を 1 列追加する。
        `display_order` はサーバ側で末尾に採番される。
        自分の印列（`type=own`）はこの API では作成できない。
      operationId: createOtherRaceMarkColumn
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  maxLength: 32
                  description: 列ラベル（空文字列許容、後から PATCH で更新可能）
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RaceMarkColumn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/races/{uid}/mark-columns/{id}:
    parameters:
      - $ref: "#/components/parameters/RaceUid"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 印列 ID
    patch:
      tags: [race-mark-columns]
      summary: 列ラベル更新
      description: |
        他人の印列のラベルを更新する。自分の印列（`type=own`）に対してリクエストすると 422 を返す。
      operationId: updateRaceMarkColumnLabel
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  maxLength: 32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RaceMarkColumn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [race-mark-columns]
      summary: 他人の印列を削除
      description: |
        他人の印列とその列に紐づく印・印メモ（出走馬・登録馬の両方）をすべて削除する。
        自分の印列（`type=own`）は削除できない（422 を返す）。
      operationId: deleteRaceMarkColumn
      security:
        - sessionAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/races/{uid}/mark-columns/{column_id}/entries/{race_entry_id}/mark:
    parameters:
      - $ref: "#/components/parameters/RaceUid"
      - name: column_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 印列 ID
      - name: race_entry_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 出走馬 ID（race_entries.id）
    put:
      tags: [race-marks]
      summary: 印を設定（または解除）
      description: |
        指定列・指定出走馬に対する印を upsert する。
        `mark_value` が空文字列の場合は印を解除（該当レコードを削除）し、
        その場合のレスポンスは 204 を返す。
      operationId: putRaceMark
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mark_value]
              properties:
                mark_value:
                  oneOf:
                    - $ref: "#/components/schemas/MarkValue"
                    - type: string
                      enum: [""]
                      description: 空文字列を渡すと印を解除する
      responses:
        "200":
          description: 印を設定または更新した
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RaceMarkValue"
        "204":
          description: 印を解除した（mark_value が空文字列の場合）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/races/{uid}/mark-columns/{column_id}/entries/{race_entry_id}/memo:
    parameters:
      - $ref: "#/components/parameters/RaceUid"
      - name: column_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 印列 ID（race_mark_columns.id）。`type=other` のみ受け付ける。
      - name: race_entry_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 出走馬 ID（race_entries.id）
    put:
      tags: [race-mark-memos]
      summary: 印メモを作成または更新
      description: |
        指定列・指定出走馬に対する印メモを upsert する。
        対象列が `type=own` の場合は 422 を返す（自分の印に対するメモは horse-notes で管理するため対象外）。
        他ユーザー所有の印列に対するリクエストは 403 を返す。
        該当の印（`race_marks`）が存在しない場合でもメモは作成可能（印を後から消してもメモは残る仕様）。
      operationId: putRaceMarkMemo
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: メモ本文。プレーンテキスト、改行可。
      responses:
        "200":
          description: 印メモを更新した
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RaceMarkMemo"
        "201":
          description: 印メモを新規作成した
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RaceMarkMemo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [race-mark-memos]
      summary: 印メモを削除
      description: |
        指定列・指定出走馬に紐づく印メモを削除する。
        対象列が `type=own` の場合は 422 を返す。
        他ユーザー所有の印列に対するリクエストは 403 を返す。
      operationId: deleteRaceMarkMemo
      security:
        - sessionAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/races/{uid}/nominations:
    parameters:
      - $ref: "#/components/parameters/RaceUid"
    post:
      tags: [race-nominations]
      summary: 登録馬を追加
      description: |
        レースに登録馬を 1 頭追加する。
        `horse_id` を指定するとその競走馬を、省略した場合は `horse_name` と名前が一致する競走馬を紐付ける。
        名前が一致する競走馬が存在しなければ生年なしで新規作成する。
        同じレースに同じ競走馬が既に登録されている場合は 422 を返す。
      operationId: createRaceNomination
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                horse_id:
                  type: [integer, "null"]
                  format: int64
                  description: 候補から選んだ競走馬 ID（horses.id）
                horse_name:
                  type: [string, "null"]
                  maxLength: 255
                  description: 馬名。horse_id 省略時は必須。前後の空白は除去される
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RaceNomination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/races/{uid}/nominations/{nomination_id}:
    parameters:
      - $ref: "#/components/parameters/RaceUid"
      - $ref: "#/components/parameters/NominationId"
    delete:
      tags: [race-nominations]
      summary: 登録馬を削除
      description: |
        登録馬を削除する。全ユーザーのチェック／消し・他人の印・印メモも削除される。競走馬メモは削除されない。
      operationId: deleteRaceNomination
      security:
        - sessionAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/races/{uid}/nominations/{nomination_id}/mark:
    parameters:
      - $ref: "#/components/parameters/RaceUid"
      - $ref: "#/components/parameters/NominationId"
    put:
      tags: [race-nominations]
      summary: 登録馬のチェック／消しを設定（または解除）
      description: |
        認証ユーザーの登録馬に対するチェック／消しを upsert する。
        `status` が空文字列の場合は解除（該当レコードを削除）し、204 を返す。
      operationId: putRaceNominationMark
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  oneOf:
                    - $ref: "#/components/schemas/RaceNominationStatus"
                    - type: string
                      enum: [""]
                      description: 空文字列を渡すと解除する
      responses:
        "200":
          description: チェック／消しを設定または更新した
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [race_nomination_id, status]
                    properties:
                      race_nomination_id:
                        type: integer
                        format: int64
                      status:
                        $ref: "#/components/schemas/RaceNominationStatus"
        "204":
          description: 解除した（status が空文字列の場合）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/races/{uid}/mark-columns/{column_id}/nominations/{nomination_id}/mark:
    parameters:
      - $ref: "#/components/parameters/RaceUid"
      - name: column_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 印列 ID（race_mark_columns.id）。`type=other` のみ受け付ける。
      - $ref: "#/components/parameters/NominationId"
    put:
      tags: [race-nomination-column-marks]
      summary: 登録馬の他人の印を設定（または解除）
      description: |
        指定列・指定登録馬に対する印を upsert する。
        `mark_value` が空文字列の場合は印を解除（該当レコードを削除）し、204 を返す。
        対象列が `type=own` の場合は 422 を返す（登録馬の自分の評価はチェック／消しで管理するため）。
        他ユーザー所有の印列に対するリクエストは 403 を返す。
        印列・登録馬が指定レースに属さない場合は 404 を返す。
      operationId: putRaceNominationColumnMark
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mark_value]
              properties:
                mark_value:
                  oneOf:
                    - $ref: "#/components/schemas/MarkValue"
                    - type: string
                      enum: [""]
                      description: 空文字列を渡すと印を解除する
      responses:
        "200":
          description: 印を設定または更新した
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RaceNominationColumnMarkValue"
        "204":
          description: 印を解除した（mark_value が空文字列の場合）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/races/{uid}/mark-columns/{column_id}/nominations/{nomination_id}/memo:
    parameters:
      - $ref: "#/components/parameters/RaceUid"
      - name: column_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 印列 ID（race_mark_columns.id）。`type=other` のみ受け付ける。
      - $ref: "#/components/parameters/NominationId"
    put:
      tags: [race-nomination-column-marks]
      summary: 登録馬の印メモを作成または更新
      description: |
        指定列・指定登録馬に対する印メモを upsert する。
        対象列が `type=own` の場合は 422 を返す。
        他ユーザー所有の印列に対するリクエストは 403 を返す。
        該当の印が存在しない場合でもメモは作成可能（印を後から消してもメモは残る仕様）。
      operationId: putRaceNominationColumnMemo
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: メモ本文。プレーンテキスト、改行可。
      responses:
        "200":
          description: 印メモを更新した
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RaceNominationColumnMemo"
        "201":
          description: 印メモを新規作成した
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RaceNominationColumnMemo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [race-nomination-column-marks]
      summary: 登録馬の印メモを削除
      description: |
        指定列・指定登録馬に紐づく印メモを削除する。
        対象列が `type=own` の場合は 422 を返す。
        他ユーザー所有の印列に対するリクエストは 403 を返す。
        印メモが存在しない場合は 404 を返す。
      operationId: deleteRaceNominationColumnMemo
      security:
        - sessionAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/horses/search:
    get:
      tags: [horses]
      summary: 競走馬の候補検索
      description: |
        馬名の部分一致で競走馬を最大 10 件、馬名昇順で返す。登録馬の馬名入力欄の候補表示に使う。
        keyword が未指定・空白のみの場合は空配列を返す。
      operationId: searchHorses
      security:
        - sessionAuth: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: 馬名の検索キーワード
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, birth_year]
                      properties:
                        id:
                          type: integer
                          format: int64
                        name:
                          type: string
                        birth_year:
                          type: [integer, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/horses/{horse}/notes:
    parameters:
      - $ref: "#/components/parameters/HorseId"
    get:
      tags: [horse-notes]
      summary: 競走馬の全メモ一覧取得
      description: |
        指定競走馬に対する、認証ユーザーの全メモを返す。
        レース紐づきあり・なしの両方を含む。`updated_at` 降順で返す。
        競走馬詳細画面（`/horses/{horse}`）で使用する。
      operationId: listHorseNotes
      security:
        - sessionAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/HorseNote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [horse-notes]
      summary: メモを作成
      description: |
        指定競走馬に対するメモを 1 件作成する。
        `race_id` を指定するとそのレースに紐づくメモになり、省略または null の場合はレースに紐づかないメモ（次走への備忘録など）になる。
        `race_id` を指定する場合、対象の競走馬がそのレースの出走馬・結果・登録馬のいずれかに含まれている必要がある。
        同一ユーザー × 同一馬 × 同一 race_id（null 含む）の組み合わせで既にメモが存在する場合は 422 を返す。
      operationId: createHorseNote
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                race_id:
                  type: [integer, "null"]
                  format: int64
                  description: 紐づけるレース ID。null または省略でレースに紐づかないメモ
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: メモ本文。プレーンテキスト、改行可
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/HorseNote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/horse-notes/{note}:
    parameters:
      - name: note
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: メモ ID（horse_notes.id）
    put:
      tags: [horse-notes]
      summary: メモを更新
      description: |
        指定メモの本文を更新する。`content` のみ更新可能で、紐づく馬・レースは変更できない。
        他ユーザー所有のメモに対するリクエストは 403 を返す。
      operationId: updateHorseNote
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/HorseNote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [horse-notes]
      summary: メモを削除
      description: |
        指定メモを物理削除する。soft delete は行わない。
        他ユーザー所有のメモに対するリクエストは 403 を返す。
      operationId: deleteHorseNote
      security:
        - sessionAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trainers/{trainer}/note:
    parameters:
      - name: trainer
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 調教師 ID（trainers.id）
    put:
      tags: [trainer-notes]
      summary: 調教師メモを作成または更新
      description: |
        認証ユーザーの当該調教師に対するメモを upsert する。
      operationId: putTrainerNote
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: メモ本文。プレーンテキスト、改行可。
      responses:
        "200":
          description: 調教師メモを更新した
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/TrainerNote"
        "201":
          description: 調教師メモを新規作成した
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/TrainerNote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [trainer-notes]
      summary: 調教師メモを削除
      description: |
        認証ユーザーの当該調教師に対するメモを物理削除する。メモが存在しない場合も 204 を返す。
      operationId: deleteTrainerNote
      security:
        - sessionAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/races/{uid}/entries/{race_entry_id}/comments:
    parameters:
      - $ref: "#/components/parameters/RaceUid"
      - name: race_entry_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 出走馬 ID（race_entries.id）。指定レースに属さない場合は 404。
    post:
      tags: [entry-comments]
      summary: 調教師・騎手コメントを追加
      description: |
        出走馬に対する調教師または騎手のコメントを 1 件追加する。
        発言者は `speaker_type` に応じて出走情報の調教師（trainer_id）または騎手（jockey_id）になる。
        出走馬に調教師が未登録の状態で `speaker_type=trainer` を指定した場合は 422。
      operationId: createEntryComment
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [speaker_type, sentiment, content]
              properties:
                speaker_type:
                  $ref: "#/components/schemas/CommentSpeakerType"
                sentiment:
                  $ref: "#/components/schemas/CommentSentiment"
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: コメント内容。プレーンテキスト、改行可。
                outcome:
                  oneOf:
                    - $ref: "#/components/schemas/CommentOutcome"
                    - type: "null"
                  description: 当否。省略または null は未入力。
      responses:
        "201":
          description: コメントを作成した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryCommentMutationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/races/{uid}/entries/{race_entry_id}/comments/{speaker_type}/{comment_id}:
    parameters:
      - $ref: "#/components/parameters/RaceUid"
      - name: race_entry_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 出走馬 ID（race_entries.id）。指定レースに属さない場合は 404。
      - name: speaker_type
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/CommentSpeakerType"
        description: 更新・削除対象コメントの現在の発言者種別（格納テーブルの判別に使う）
      - name: comment_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: コメント ID（trainer_comments.id または jockey_comments.id）。他ユーザーのコメントは 404。
    patch:
      tags: [entry-comments]
      summary: 調教師・騎手コメントを更新
      description: |
        コメントを部分更新する。送ったフィールドだけを更新する（結果画面からの当否のみの更新にも使う）。
        `speaker_type` を変更した場合は格納テーブルが変わるため、コメントは別 ID で作り直される（`created_at` は引き継ぐ）。
        出走馬に調教師が未登録の状態で `speaker_type=trainer` を指定した場合は 422。
      operationId: updateEntryComment
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                speaker_type:
                  $ref: "#/components/schemas/CommentSpeakerType"
                sentiment:
                  $ref: "#/components/schemas/CommentSentiment"
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
                outcome:
                  oneOf:
                    - $ref: "#/components/schemas/CommentOutcome"
                    - type: "null"
                  description: 当否。null で未入力に戻す。
      responses:
        "200":
          description: コメントを更新した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryCommentMutationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [entry-comments]
      summary: 調教師・騎手コメントを削除
      description: コメントを物理削除し、集計し直した的中率を返す。
      operationId: deleteEntryComment
      security:
        - sessionAuth: []
      responses:
        "200":
          description: コメントを削除した
          content:
            application/json:
              schema:
                type: object
                required: [stats]
                properties:
                  stats:
                    $ref: "#/components/schemas/EntryCommentStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    RaceUid:
      name: uid
      in: path
      required: true
      schema:
        type: string
      description: レースの公開 UID（races.uid）

    HorseId:
      name: horse
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 競走馬 ID（horses.id）

    NominationId:
      name: nomination_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 登録馬 ID（race_nominations.id）

  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Laravel のセッション Cookie。CSRF トークンも併用する。

  schemas:
    MarkValue:
      type: string
      enum:
        - "◎"
        - "○"
        - "▲"
        - "△"
        - "☆"
        - "✓"
      description: |
        印の種類。6 種類のいずれか（本命 ◎ / 対抗 ○ / 単穴 ▲ / 連下 △ / 穴 ☆ / チェック ✓）。
        issue #206 で穴馬の記号を `×` から標準的な `☆` に変更（`×` は本来「消し」を意味するため）。

    RaceMarkColumnType:
      type: string
      enum: [own, other]
      description: |
        印列の種類。
        - `own`: ログインユーザー自身の印列。1 ユーザー 1 レースに 1 列固定。
        - `other`: 他人の印列。レース内で 0 列以上、動的に追加削除可能。

    RaceMarkColumn:
      type: object
      required: [id, type, label, display_order]
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/RaceMarkColumnType"
        label:
          type: [string, "null"]
          maxLength: 32
          description: 列ラベル。`type=own` のときは null。`type=other` のときは文字列（空文字列を含む）。
        display_order:
          type: integer
          minimum: 0
          description: 表示順。昇順で並べる。

    RaceMarkValue:
      type: object
      required: [column_id, race_entry_id, mark_value]
      properties:
        column_id:
          type: integer
          format: int64
          description: 印列 ID（race_mark_columns.id）
        race_entry_id:
          type: integer
          format: int64
          description: 出走馬 ID（race_entries.id）
        mark_value:
          $ref: "#/components/schemas/MarkValue"

    RaceMarkMemo:
      type: object
      required:
        [
          id,
          race_mark_column_id,
          race_entry_id,
          content,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: integer
          format: int64
        race_mark_column_id:
          type: integer
          format: int64
          description: 印列 ID（race_mark_columns.id）
        race_entry_id:
          type: integer
          format: int64
          description: 出走馬 ID（race_entries.id）
        content:
          type: string
          maxLength: 1000
          description: メモ本文 プレーンテキスト
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RaceNominationColumnMarkValue:
      type: object
      required: [column_id, race_nomination_id, mark_value]
      properties:
        column_id:
          type: integer
          format: int64
          description: 印列 ID（race_mark_columns.id）
        race_nomination_id:
          type: integer
          format: int64
          description: 登録馬 ID（race_nominations.id）
        mark_value:
          $ref: "#/components/schemas/MarkValue"

    RaceNominationColumnMemo:
      type: object
      required:
        [
          id,
          race_mark_column_id,
          race_nomination_id,
          content,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: integer
          format: int64
        race_mark_column_id:
          type: integer
          format: int64
          description: 印列 ID（race_mark_columns.id）
        race_nomination_id:
          type: integer
          format: int64
          description: 登録馬 ID（race_nominations.id）
        content:
          type: string
          maxLength: 1000
          description: メモ本文 プレーンテキスト
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HorseNote:
      type: object
      required: [id, horse_id, race_id, content, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        horse_id:
          type: integer
          format: int64
        race_id:
          type: [integer, "null"]
          format: int64
          description: 紐づくレース ID。null の場合はレースに紐づかないメモ
        race:
          type: [object, "null"]
          description: レース紐づきありの場合に、表示用のレース情報を含む
          required: [uid, race_date, venue_name, race_number, race_name]
          properties:
            uid:
              type: string
            race_date:
              type: string
              format: date
            venue_name:
              type: string
            race_number:
              type: integer
            race_name:
              type: [string, "null"]
        content:
          type: string
          maxLength: 1000
          description: メモ本文 プレーンテキスト
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TrainerNote:
      type: object
      required: [id, trainer_id, content, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        trainer_id:
          type: integer
          format: int64
          description: 調教師 ID（trainers.id）
        content:
          type: string
          maxLength: 1000
          description: メモ本文 プレーンテキスト
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CommentSpeakerType:
      type: string
      enum: [trainer, jockey]
      description: 発言者種別（調教師 / 騎手）

    CommentSentiment:
      type: string
      enum: [positive, conditional, negative]
      description: コメントの向き（前向き / 条件付き / 弱気）

    CommentOutcome:
      type: string
      enum: [hit, miss, undeterminable]
      description: 当否（当たり / 外れ / 判定不能）

    EntryComment:
      type: object
      required: [id, speaker_type, speaker_id, speaker_name, sentiment, content, outcome, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: コメント ID（speaker_type に応じて trainer_comments.id / jockey_comments.id）
        speaker_type:
          $ref: "#/components/schemas/CommentSpeakerType"
        speaker_id:
          type: integer
          format: int64
          description: 発言者 ID（trainers.id または jockeys.id）
        speaker_name:
          type: string
          description: 発言者名
        sentiment:
          $ref: "#/components/schemas/CommentSentiment"
        content:
          type: string
          maxLength: 1000
        outcome:
          oneOf:
            - $ref: "#/components/schemas/CommentOutcome"
            - type: "null"
          description: 当否。null は未入力
        created_at:
          type: string
          format: date-time

    CommentHitRate:
      type: object
      required: [hit, judged]
      properties:
        hit:
          type: integer
          minimum: 0
          description: 当たりの件数
        judged:
          type: integer
          minimum: 0
          description: 当たり + 外れ の件数（判定不能・未入力は含めない）

    CommentSentimentStats:
      type: object
      description: 発言者 1 人分の向き別の的中率。認証ユーザーのコメントのみを全レース分集計する。
      required: [positive, conditional, negative]
      properties:
        positive:
          $ref: "#/components/schemas/CommentHitRate"
        conditional:
          $ref: "#/components/schemas/CommentHitRate"
        negative:
          $ref: "#/components/schemas/CommentHitRate"

    EntryCommentStats:
      type: object
      description: 当該出走の調教師・騎手それぞれの的中率
      required: [trainer_id, trainer, jockey_id, jockey]
      properties:
        trainer_id:
          type: [integer, "null"]
          format: int64
          description: 出走情報の調教師 ID。未登録は null
        trainer:
          oneOf:
            - $ref: "#/components/schemas/CommentSentimentStats"
            - type: "null"
          description: 調教師の的中率。調教師が未登録の場合は null
        jockey_id:
          type: integer
          format: int64
          description: 出走情報の騎手 ID
        jockey:
          $ref: "#/components/schemas/CommentSentimentStats"

    EntryCommentMutationResponse:
      type: object
      required: [data, stats]
      properties:
        data:
          $ref: "#/components/schemas/EntryComment"
        stats:
          $ref: "#/components/schemas/EntryCommentStats"

    RaceNominationStatus:
      type: string
      enum: [check, excluded]
      description: 登録馬に対するチェック（check）／消し（excluded）

    RaceNomination:
      type: object
      required: [id, horse_id, horse_uid, horse_name, status, note]
      properties:
        id:
          type: integer
          format: int64
          description: 登録馬 ID（race_nominations.id）
        horse_id:
          type: integer
          format: int64
        horse_uid:
          type: string
        horse_name:
          type: string
        status:
          oneOf:
            - $ref: "#/components/schemas/RaceNominationStatus"
            - type: "null"
          description: 認証ユーザーのチェック／消し。未設定は null
        note:
          type: [object, "null"]
          description: 認証ユーザーの競走馬メモ（レース紐づきを優先）。なければ null
          required: [id, content, source]
          properties:
            id:
              type: integer
              format: int64
            content:
              type: string
            source:
              type: string
              enum: [race, horse]

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ValidationErrorBody:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  responses:
    Unauthorized:
      description: 認証されていない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 権限がない（他ユーザー所有の印列など）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 対象が存在しない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorBody"
